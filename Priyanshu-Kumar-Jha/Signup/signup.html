<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>Create your account</h1>

            <form id="signupForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" placeholder="e.g. Alex" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" placeholder="Atleast 6 characters" pattern="(?=.*!@#$%^&*()-+)(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).{8,}" id="myInput0" required>
                        <button type="button" class="toggle-password" onclick="myFunction0()">👁</button>
                    
                    </div>
                    <div class="password-strength">
                
                    </div>
                    
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" placeholder="Repeat your password" pattern="(?=.*!@#$%^&*()-+)(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).{8,}" id="myInput1" required>
                        <button type="button" class="toggle-password" onclick="myFunction1()">👁</button>
                    </div>
                    <div class="password-strength">

                    </div>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <p class="footer-text">Already have an account? <a href="signin.html">Log in</a></p>
        </div>
    </div>
    <script src="signup.js"></script>
</body>
</html>
